<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNEC – Gallery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Gallery Stylesheet -->
  <link rel="stylesheet" href="../css/gallery.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ══════════════════════════════
       SIDEBAR OVERLAY (mobile backdrop)
  ══════════════════════════════ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ══════════════════════════════
       SIDEBAR
  ══════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="../image/Logo.png" alt="JNEC Logo" onerror="this.style.display='none'" />
      </div>
      <div class="brand-text">
        <span class="brand-name">JNEC Club<br>Management</span>
        <span class="brand-sub">Student Panel</span>
      </div>
    </div>

    <!-- MAIN -->
    <nav class="nav-group">
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-item" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <!-- CLUB ACTIVITY -->
    <nav class="nav-group">
      <div class="nav-group-label">Club Activity</div>
      <a href="announcement.html" class="nav-item" data-page="announcements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Announcements
      </a>
      <a href="attendance.html" class="nav-item" data-page="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <path d="M9 16l2 2 4-4"/>
        </svg>
        My Attendance
      </a>
    </nav>

    <!-- CLUB CONTENT -->
    <nav class="nav-group">
      <div class="nav-group-label">Club Content</div>
      <a href="workplan.html" class="nav-item" data-page="workplus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        Work Plan
      </a>
      <a href="gallery.html" class="nav-item active" data-page="gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Gallery
      </a>
      <a href="blog.html" class="nav-item" data-page="blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
  Club Blog
</a>
    </nav>

  </aside>

  <!-- ══════════════════════════════
       MAIN CONTENT
  ══════════════════════════════ -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">

        <!-- HAMBURGER — visible on mobile -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="topbar-titles">
          <span class="topbar-title">Gallery</span>
          <span class="topbar-subtitle">Photos from club activities and recent performances</span>
        </div>
      </div>

      <div class="topbar-right">

        <!-- My Club Link -->
        <a href="../html/generalpage.html" class="my-club-link" title="Go to My Club">
          <div class="my-club-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="my-club-label">My Club</span>
        </a>

        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">JL</div>
          <span class="profile-name">Jigme</span>
        </button>

      </div>
    </header>

    <!-- PAGE BODY -->
    <div class="page-body">

      <!-- Filter Bar -->
      <div class="date-filter-bar">
        <span class="album-count" id="albumCount"></span>
        <button class="sort-btn" id="sortBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="14" y2="12"/>
            <line x1="4" y1="18" x2="8" y2="18"/>
          </svg>
          Recently Uploaded
        </button>
      </div>

      <!-- Gallery Grid — populated by gallery.js -->
      <div class="gallery-grid" id="galleryGrid"></div>

    </div><!-- /page-body -->

  </div><!-- /main-content -->

</div><!-- /app-wrapper -->

<!-- ══════════════════════════════
     LIGHTBOX MODAL
══════════════════════════════ -->
<div class="lightbox-backdrop" id="lightboxBackdrop">
  <div class="lightbox" id="lightbox">

    <!-- Header -->
    <div class="lb-header">
      <div class="lb-header-left">
        <div class="lb-title-row">
          <span class="lb-title" id="lbTitle">Event Title</span>
        </div>
        <div class="lb-meta" id="lbMeta">Date · N photos</div>
        <div class="lb-desc" id="lbDesc">Description goes here.</div>
      </div>
      <div class="lb-header-right">
        <button class="lb-action-btn lb-btn-download" id="lbDownloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>
        <button class="lb-action-btn lb-btn-close" id="lbCloseBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Close
        </button>
      </div>
    </div>

    <!-- Main Image Viewer -->
    <div class="lb-main-img">
      <img id="lbMainImg" src="" alt="Gallery photo" />
      <button class="lb-img-nav lb-nav-prev" id="lbPrev" title="Previous (← key)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="lb-img-nav lb-nav-next" id="lbNext" title="Next (→ key)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div class="lb-img-counter" id="lbCounter">1 / 8</div>
    </div>

    <!-- Thumbnail Strip -->
    <div class="lb-thumbs" id="lbThumbs"></div>

  </div><!-- /lightbox -->
</div><!-- /lightbox-backdrop -->

<script src="../js/gallery.js"></script>
</body>
</html>
