<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNEC – Club Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/blog.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- ══════════════════════════════
       SIDEBAR
  ══════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="../image/Logo.png" alt="JNEC Logo" onerror="this.style.display='none'" />
      </div>
      <div class="brand-text">
        <span class="brand-name">JNEC Club<br>Management</span>
        <span class="brand-sub">Student Panel</span>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-item" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <nav class="nav-group">
      <div class="nav-group-label">Club Activity</div>
      <a href="announcement.html" class="nav-item" data-page="announcements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Announcements
      </a>
      <a href="attendance.html" class="nav-item" data-page="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <path d="M9 16l2 2 4-4"/>
        </svg>
        My Attendance
      </a>
    </nav>

    <nav class="nav-group">
      <div class="nav-group-label">Club Content</div>
      <a href="workplan.html" class="nav-item" data-page="workplus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        Work Plan
      </a>
      <a href="gallery.html" class="nav-item" data-page="gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Gallery
      </a>
      <a href="blog.html" class="nav-item active" data-page="blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Club Blog
      </a>
    </nav>

  </aside>

  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ══════════════════════════════
       MAIN CONTENT
  ══════════════════════════════ -->
  <div class="main-content">

    <header class="topbar">
      <div class="topbar-left">
        <!-- Hamburger button — visible on mobile -->
        <button class="hamburger-btn" id="hamburgerBtn" title="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar-title-group">
          <span class="topbar-title">Club Blog</span>
          <span class="topbar-subtitle">Articles and stories from your club's adviser and secretary</span>
        </div>
      </div>
      <div class="topbar-right">
        <a href="../html/generalpage.html" class="my-club-link" title="Go to My Club">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>My Club</span>
        </a>
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">JL</div>
          <span class="profile-name">Jigme</span>
        </button>
      </div>
    </header>

    <div class="page-body">

      <!-- ── Filter Bar (search + sort) — no section title above ── -->
      <div class="filter-bar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search blogs by title, author..." />
        </div>
        <div class="sort-wrap">
          <label class="sort-label" for="sortSelect">Sort by:</label>
          <div class="sort-select-wrap">
            <select id="sortSelect" class="sort-select">
              <option value="newest">Latest First</option>
              <option value="oldest">Oldest First</option>
            </select>
            <svg class="sort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Blog Grid -->
      <div class="blogs-grid" id="blogsGrid"></div>

    </div>
  </div>
</div>

<!-- ══════════════════════════════
     BLOG POST MODAL
══════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <!-- Top bar -->
    <div class="modal-topbar">
      <span class="modal-label">Blog Post</span>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Cover image area -->
    <div class="modal-cover" id="modalCover">
      <div class="modal-cover-placeholder" id="modalCoverPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <img id="modalCoverImg" src="" alt="" style="display:none;" />
    </div>

    <!-- Body -->
    <div class="modal-body">
      <h2 class="modal-title" id="modalTitle"></h2>

      <div class="modal-author-row">
        <div class="modal-author-avatar" id="modalAuthorAvatar"></div>
        <span class="modal-author-name"  id="modalAuthorName"></span>
        <span class="modal-author-sep">·</span>
        <span class="modal-author-date"  id="modalAuthorDate"></span>
      </div>

      <div class="modal-content" id="modalContent"></div>
    </div>

  </div>
</div>

<script src="../js/blog.js"></script>
</body>
</html>
