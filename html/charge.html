<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUB GuestHouse | Super Admin - Room Charges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/charge.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23172D3D'/%3E%3Ctext x='50' y='68' font-size='44' text-anchor='middle' fill='%23c9a84c' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E" alt="RUB Logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">RUB GuestHouse</span>
        <span class="brand-sub">Super Admin</span>
      </div>
    </div>

    <nav class="nav-group">
      
      <a href="#" class="nav-item active" data-page="charges">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        Room Charges
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Room Charges</span>
        <span class="topbar-subtitle">Set standardized room pricing across all guesthouses</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">SA</div>
          <span class="profile-name">Super Admin</span>
        </button>
      </div>
    </header>

    <!-- PAGE BODY -->
    <div class="page-body" id="page-body"></div>

  </div>
</div>

<!-- Add Room Charge Modal -->
<div class="modal-overlay" id="addRoomModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Add New Room Charge</h3>
      <button class="modal-close" onclick="closeAddRoomModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Room Type</label>
        <input type="text" id="newRoomType" class="form-input" placeholder="e.g., Normal, Executive, Deluxe, Suite" value="Normal">
      </div>
      <div class="form-group">
        <label>User Category</label>
        <input type="text" id="newUserType" class="form-input" placeholder="e.g., RUB Student, Outside Visitor, International" value="RUB Student">
      </div>
      <div class="form-group">
        <label>Price per bed / night (Nu.)</label>
        <input type="number" id="newPrice" class="form-input" placeholder="Enter price" min="0" step="50">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeAddRoomModal()">Cancel</button>
      <button class="btn-primary" onclick="addNewCharge()">Add Charge</button>
    </div>
  </div>
</div>

<script src="../js/charge.js"></script>
</body>
</html>
