<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUB GuestHouse | Super Admin - Booking Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/userbook.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23172D3D'/%3E%3Ctext x='50' y='68' font-size='44' text-anchor='middle' fill='%23c9a84c' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E" alt="RUB Logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">RUB GuestHouse</span>
        <span class="brand-sub">Super Admin</span>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-group-label">Main</div>
      <a href="#" class="nav-item active" data-page="bookings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        All Bookings
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">All Bookings</span>
        <span class="topbar-subtitle">View all guesthouse bookings</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">SA</div>
          <span class="profile-name">Super Admin</span>
        </button>
      </div>
    </header>

    <!-- PAGE BODY -->
    <div class="page-body" id="page-body"></div>

  </div>
</div>

<!-- Booking Details Modal -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Booking Details</h3>
      <button class="modal-close" onclick="closeBookingModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal-container history-modal">
    <div class="modal-header">
      <h3 id="historyModalTitle">Booking History</h3>
      <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
    </div>
    <div class="modal-body" id="historyModalBody"></div>
  </div>
</div>

<script src="../js/userbook.js"></script>
</body>
</html>
