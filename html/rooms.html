<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUB GuestHouse | Manage Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/rooms.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-avatar">R</div>
      <div class="brand-text">
        <span class="brand-name">RUB GuestHouse</span>
        <span class="brand-sub">Guesthouse Incharge</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="rooms">
        Manage Rooms
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar">GI</div>
        <div class="admin-details">
          <p>Guesthouse Incharge</p>
          <span>JNEC GuestHouse</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Manage Rooms</span>
        <div>Add and manage your guesthouse rooms</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-date" id="topbarDate"></div>
      </div>
    </header>

    <!-- PAGE BODY -->
    <div class="page-body" id="page-body"></div>

  </div>
</div>

<!-- Add Rooms Modal -->
<div class="modal-overlay" id="addRoomsModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Add Rooms</h3>
      <button class="modal-close" onclick="closeAddRoomsModal()">&times;</button>
    </div>
    <div class="modal-body" id="addRoomsBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeAddRoomsModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAddRooms()">Create Rooms</button>
    </div>
  </div>
</div>

<!-- Edit Room Modal -->
<div class="modal-overlay" id="editRoomModal">
  <div class="modal-container">
    <div class="modal-header">
      <h3 id="editModalTitle">Edit Room</h3>
      <button class="modal-close" onclick="closeEditRoomModal()">&times;</button>
    </div>
    <div class="modal-body" id="editRoomBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeEditRoomModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEditRoom()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Bed Details Modal -->
<div class="modal-overlay" id="bedDetailsModal">
  <div class="modal-container bed-details-modal">
    <div class="modal-header">
      <h3 id="bedModalTitle">Bed Details</h3>
      <button class="modal-close" onclick="closeBedDetailsModal()">&times;</button>
    </div>
    <div class="modal-body" id="bedDetailsBody"></div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-container small-modal">
    <div class="modal-header">
      <h3>Delete Room</h3>
      <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p id="deleteMessage">Are you sure you want to delete this room? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="../js/rooms.js"></script>
</body>
</html>
