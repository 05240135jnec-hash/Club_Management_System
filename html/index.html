<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNEC – Sidebar & Topbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
    }

    .app-wrapper { display: flex; width: 100%; min-height: 100vh; }

    /* ══════════════════════════════
       SIDEBAR
    ══════════════════════════════ */
    .sidebar {
      width: 200px;
      min-width: 200px;
      background: #172D3D;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 100;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Brand */
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    .brand-avatar {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-avatar img {
      width: 80px;
      height: 85px;
      object-fit: contain;
      border-radius: 0;
      filter: brightness(1.1) contrast(1.05);
    }

    .brand-text { display: flex; flex-direction: column; }

    .brand-name {
      font-size: 12px; font-weight: 700;
      color: #ffffff; line-height: 1.3;
    }

    .brand-sub {
      font-size: 10px; font-weight: 400;
      color: #6b7f93; margin-top: 3px;
    }

    /* Nav Groups */
    .nav-group { padding: 20px 0 0; }

    .nav-group-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffffff;
      padding: 0 16px 10px 16px;
      line-height: 15px;
      opacity: 0.9;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      color: #7a8fa0;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item svg {
      width: 16px; height: 16px;
      flex-shrink: 0; opacity: 0.65;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.06);
      color: #c8d8e4;
    }
    .nav-item:hover svg { opacity: 0.9; }

    .nav-item.active {
      background: #1e3d52;
      color: #ffffff;
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: #2d5be3;
      border-radius: 0 2px 2px 0;
    }
    .nav-item.active svg { opacity: 1; }

    /* ══════════════════════════════
       MAIN CONTENT AREA
    ══════════════════════════════ */
    .main-content {
      margin-left: 200px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f0f2f5;
    }

    /* ══════════════════════════════
       TOP BAR
    ══════════════════════════════ */
    .topbar {
      height: 65px;
      background: #fff;
      border-bottom: 1px solid #e8eaf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left { display: flex; flex-direction: column; }
    .topbar-title    { font-size: 18px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
    .topbar-subtitle { font-size: 11px; color: #8892a4; margin-top: 1px; }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .icon-btn {
      position: relative;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: #f0f2f5;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      color: #4a5568;
    }
    .icon-btn:hover { background: #e2e6ef; color: #1a1a2e; }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Profile button */
    .profile-btn {
      display: flex; align-items: center; gap: 8px;
      background: #f0f2f5;
      border: none;
      border-radius: 24px;
      padding: 5px 12px 5px 5px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .profile-btn:hover { background: #e2e6ef; }

    .profile-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #8892a4;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
    }

    .profile-name { font-size: 12.5px; font-weight: 600; color: #1a1a2e; }

    /* Placeholder page body */
    .page-body { padding: 28px; flex: 1; }

    /* Responsive */
    @media (max-width: 640px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .topbar { padding: 0 18px; }
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- ══════════════════════════════
       SIDEBAR
  ══════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="../image/Logo.png" alt="JNEC Logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">JNEC Club<br>Management</span>
        <span class="brand-sub">Student Panel</span>
      </div>
    </div>

    <!-- MAIN -->
    <nav class="nav-group">
      <div class="nav-group-label">Main</div>

      <a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <!-- CLUB ACTIVITY -->
    <nav class="nav-group">
      <div class="nav-group-label">Club Activity</div>

      <a href="#" class="nav-item" data-page="announcements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Announcements
      </a>

      <a href="#" class="nav-item" data-page="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <path d="M9 16l2 2 4-4"/>
        </svg>
        My Attendance
      </a>
    </nav>

    <!-- CLUB CONTENT -->
    <nav class="nav-group">
      <div class="nav-group-label">Club Content</div>

      <a href="#" class="nav-item" data-page="workplus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        Work Plus
      </a>

      <a href="#" class="nav-item" data-page="gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Gallery
      </a>

      <a href="#" class="nav-item" data-page="clubpage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Club Page
      </a>
    </nav>

  </aside>

  <!-- ══════════════════════════════
       MAIN CONTENT
  ══════════════════════════════ -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Announcement</span>
        <span class="topbar-subtitle">Information of the club</span>
      </div>

      <div class="topbar-right">
        <!-- Notification Bell -->
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <!-- Profile -->
        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">JL</div>
          <span class="profile-name">Jigme</span>
        </button>
      </div>
    </header>

    <!-- Page body — add your content here -->
    <div class="page-body"></div>

  </div>

</div>

<script>
  // Sidebar nav active state + topbar title update
  const pageTitles = {
    dashboard:     'Dashboard',
    announcements: 'Announcements',
    attendance:    'My Attendance',
    workplus:      'Work Plus',
    gallery:       'Gallery',
    clubpage:      'Club Page'
  };

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const t = document.getElementById('topbar-title');
      if (t) t.textContent = pageTitles[item.dataset.page] || 'Dashboard';
    });
  });
</script>

</body>
</html>
