<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUB Guest House | Super Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../css/super.css" />
</head>
<body>

<div class="app-wrapper">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e3d52'/%3E%3Ctext x='50' y='68' font-size='44' text-anchor='middle' fill='white' font-weight='bold'%3ERUB%3C/text%3E%3C/svg%3E" alt="RUB Logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">RUB Guest House</span>
        <span class="brand-sub">Super Admin</span>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-group-label">Admin Tools</div>
      <a href="#" class="nav-item active" data-page="upload-users"><i class="ti ti-upload"></i> Upload users</a>
      <a href="#" class="nav-item" data-page="manage-users"><i class="ti ti-users"></i> Manage users</a>
      <a href="#" class="nav-item" data-page="fetch-verify"><i class="ti ti-search"></i> Fetch / verify</a>
      <hr class="divider" />
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">Upload RUB user data</span>
        <span class="topbar-subtitle">Add students and lecturers for auto-fetch during booking</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications"><i class="ti ti-bell"></i></button>
        <button class="profile-btn" title="Profile">
          <div class="profile-avatar">SA</div>
          <span class="profile-name">Super Admin</span>
        </button>
      </div>
    </header>

    <div class="page-body" id="page-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/super.js"></script>
</body>
</html>
