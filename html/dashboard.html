<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JNEC Club Management – Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
      <div class="brand-avatar">
        <img src="../image/Logo.png" alt="JNEC Logo" />
      </div>
      <div class="brand-text">
        <span class="brand-name">JNEC Club<br>Management</span>
        <span class="brand-sub">Student Panel</span>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-group-label">Main</div>
      <a href="dashboard.html" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
    </nav>

    <nav class="nav-group">
      <div class="nav-group-label">Club Activity</div>
      <a href="announcement.html" class="nav-item" data-page="announcements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Announcements
      </a>
      <a href="attendance.html" class="nav-item" data-page="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <path d="M9 16l2 2 4-4"/>
        </svg>
        My Attendance
      </a>
    </nav>

    <nav class="nav-group">
      <div class="nav-group-label">Club Content</div>
      <a href="workplan.html" class="nav-item" data-page="workplus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        Work Plan
      </a>
      <a href="gallery.html" class="nav-item" data-page="gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Gallery
      </a>
      <a href="blog.html" class="nav-item" data-page="blog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
  Club Blog
</a>
      </a>
    </nav>

  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-titles">
          <span class="topbar-title" id="topbar-title">Dashboard</span>
          <span class="topbar-subtitle" id="topbar-subtitle">Welcome back to your dashboard</span>
        </div>
      </div>

      <div class="topbar-right">
        <a href="../html/generalpage.html" class="my-club-link" title="Go to My Club">
          <div class="my-club-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="my-club-label">My Club</span>
        </a>

        <button class="icon-btn" title="Notifications" id="notif-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-badge" id="notif-badge"></span>
        </button>

        <button class="profile-btn" title="Profile" id="profile-btn">
          <div class="profile-avatar">JL</div>
          <span class="profile-name">Jigme</span>
        </button>
      </div>
    </header>

    <!-- PAGE BODY -->
    <div class="page-body" id="pageBody">

      <div class="greeting-row">
        <div>
          <h1 class="greeting-title" id="greetingTitle">Good morning, Jigme</h1>
          <p class="greeting-sub" id="greetingSub">Welcome back to your dashboard</p>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid"></div>

      <div class="section-card">
        <div class="section-header">
          <div class="section-header-left">
            <h2 class="section-title">Upcoming Announcements</h2>
          </div>
          <a href="announcement.html" class="view-all-link">View all</a>
        </div>
        <div class="announce-list" id="announceList"></div>
      </div>

    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════
     ANNOUNCEMENT DETAIL MODAL (with image)
══════════════════════════════════════════ -->
<div class="modal-backdrop" id="announce-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">

    <button class="modal-close" id="modal-close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- Hero image (hidden when no image) -->
    <div class="modal-img-wrap" id="modal-img-wrap">
      <img class="modal-img" id="modal-img" src="" alt="Announcement image" />
      <div class="modal-img-overlay"></div>
    </div>

    <!-- Content area -->
    <div class="modal-content-area">
      <span class="modal-badge" id="modal-badge-wrap">
        <span class="modal-badge-dot"></span>New
      </span>

      <h2 class="modal-title" id="modal-title"></h2>

      <!-- Date and posted-by sit on the same line, same muted style -->
      <div class="modal-meta-row">
        <p class="modal-date" id="modal-date"></p>
        <p class="modal-posted-by" id="modal-posted-by"></p>
      </div>

      <hr class="modal-divider" />
      <p class="modal-desc" id="modal-desc"></p>
    </div>

  </div>
</div>

<script src="../js/dashboard.js"></script>
</body>
</html>
